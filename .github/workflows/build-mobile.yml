name: Build GUESS THE 11 Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Shared & Client
        env:
          VITE_BACKEND_URL: https://trails-compressed-whom-compare.trycloudflare.com
        run: |
          npm run build:shared
          npm run build:client

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Pre-installed Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x client/android/gradlew

      - name: Build Android APKs & Bundle
        run: |
          cd client/android
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Organize Release Artifacts
        run: |
          mkdir -p release/android
          cp client/android/app/build/outputs/apk/debug/app-debug.apk release/android/GuessThe11-debug.apk || true
          cp client/android/app/build/outputs/apk/release/app-release-unsigned.apk release/android/GuessThe11-release.apk || true
          cp client/android/app/build/outputs/bundle/release/app-release.aab release/android/GuessThe11.aab || true

      - name: Upload Android Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: GuessThe11-Direct-Install-APK
          path: client/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Android Release APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: GuessThe11-GooglePlay-AAB-and-Release
          path: |
            client/android/app/build/outputs/apk/release/*.apk
            client/android/app/build/outputs/bundle/release/*.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: GUESS THE 11 - v1.0.0 Online Multiplayer Release
          body: |
            # 🎮 GUESS THE 11 - Global Multiplayer Mobile Release
            
            Play online with up to 11 players from any Wi-Fi or mobile network (4G/5G) anywhere in the world!
            
            ### 📥 Direct Downloads:
            - **[GuessThe11-debug.apk](https://github.com/tharanitharan2006tt-ui/guess-the-11/releases/download/v1.0.0/GuessThe11-debug.apk)** (Direct Install APK - Tap to install on any Android phone)
            - **[GuessThe11.aab](https://github.com/tharanitharan2006tt-ui/guess-the-11/releases/download/v1.0.0/GuessThe11.aab)** (Google Play Store App Bundle)
            - **[GuessThe11-release.apk](https://github.com/tharanitharan2006tt-ui/guess-the-11/releases/download/v1.0.0/GuessThe11-release.apk)** (Release APK)
            
            ### 🌐 Features in this release:
            - **Global Online Multiplayer**: Works across different Wi-Fi and mobile networks globally.
            - **Room Password / PIN**: Lock your room with a custom password and share via WhatsApp.
            - **11-Player Realtime Drawing & Guessing**: Canvas sync, chat, timer, leaderboard & results.
          files: |
            release/android/GuessThe11-debug.apk
            release/android/GuessThe11-release.apk
            release/android/GuessThe11.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Prepare & Verify iOS Xcode Project
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Shared & Client Web
        env:
          VITE_BACKEND_URL: https://trails-compressed-whom-compare.trycloudflare.com
        run: |
          npm run build:shared
          npm run build:client

      - name: Sync Capacitor iOS
        run: |
          cd client
          npx cap sync ios

      - name: Upload iOS Xcode Project Bundle
        uses: actions/upload-artifact@v4
        with:
          name: GuessThe11-iOS-Xcode-Project
          path: client/ios/
