services:
  - type: web
    name: guess-the-11-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:server
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: "*"
